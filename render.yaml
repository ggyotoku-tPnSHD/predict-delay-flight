services:
  - type: web
    name: flight-delay
    runtime: python
    plan: free
    rootDir: src
    buildCommand: pip install -r ../requirements.txt
    startCommand: uvicorn serve:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
